name: Publish

# Publishes to crates.io when a `v*` tag is pushed. Authentication is
# crates.io Trusted Publishing: the job's GitHub OIDC token is exchanged for a
# short-lived crates.io token, so no long-lived API token lives in secrets.
# Trusted Publishing can only be configured on a crate that already exists,
# so the first release of a new crate is published by hand (README,
# "Releasing"); every later one goes through here.
#
# The CI workflow does not run on tags, and `cargo publish` verifies only
# that the package builds, so the tests and the dependency policy run here
# first: a tag on a red commit must not publish.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-26.04
    # Must match the environment named in the crate's Trusted Publishing
    # configuration on crates.io. GitHub creates it unprotected on first use;
    # give it a deployment-branch rule allowing only `v*` tags (README,
    # "Releasing") so a workflow run from anywhere else cannot mint a token.
    environment: crates-io
    permissions:
      contents: read
      # Mint the OIDC token crates-io-auth-action exchanges for a publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, and a release job should not hold a token
          # that could.
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      # No build cache on purpose: a release build must not restore
      # artifacts produced by other branches.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked
      - run: cargo test --doc --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: Refuse a tag that does not match Cargo.toml
        run: |
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # `publish` packages, builds the package from scratch and uploads it; a
      # package that does not build is rejected before anything is uploaded.
      # `--locked` publishes the graph the tests and cargo-deny just ran on.
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
