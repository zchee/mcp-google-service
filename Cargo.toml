[package]
name = "mcp-google-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
# Nothing here is meant for crates.io: the binary embeds an 11MB catalog
# snapshot and targets one operator workflow.
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
gcp_auth = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "stream"] }
# Zero-copy archived form of the committed catalog snapshot. The serve path
# validates and reads the embedded archive in place instead of parsing 11.6 MB
# of JSON; `bytecheck` (a default feature) is what makes the checked `access`
# the default path rather than an option. The three format-control features
# are rkyv's defaults spelled out, as its docs ask binaries to do: the archive
# is fixed little-endian with 32-bit offsets and aligned primitives on every
# builder, so `data/catalog-snapshot.bin` is portable and a future default
# change cannot silently re-shape it (the identity test would also refuse it).
rkyv = { version = "0.8.18", features = ["little_endian", "pointer_width_32", "aligned"] }
rmcp = { version = "3.1", features = ["server", "client", "transport-io", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `sync` is named explicitly: the readiness watch channel, the lazy credential
# cell and the catalog lock all come from `tokio::sync`, and relying on a
# transitive dependency to switch it on would make this crate's build depend on
# rmcp's feature choices.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Scrubs the cached access token's heap buffer on drop, so a token does not
# outlive its `AuthContext` in freed memory.
zeroize = "1"
# Compresses each tool's input/output schema JSON inside the archive; schemas
# are 60% of the snapshot and are read only by `describe_tools`, so they stay
# compressed until something asks. C library (zstd-sys): the only C-source
# dependency this optimization run added to a credential-handling binary,
# flagged for the security reviewer as a trust-base expansion on that basis.
#
# `default-features = false` drops the `legacy` feature, which compiles the
# ZSTDv01-v07 decoders in (~25 KB of `__text` the dispatcher pins and ld64
# cannot strip); every frame this binary reads is one it wrote itself with
# this same library, so there is nothing legacy to decode.
zstd = { version = "0.13.3", default-features = false }

# Test-only. The integration tier runs REAL in-process servers (a genuine rmcp
# MCP server and a Service Usage REST stub) behind TLS, because both
# `Catalog::build_live` and `prune::enabled_services` construct `https://` URLs
# against fixed Google hostnames. Tests reach them by pointing the reqwest
# client's DNS at a loopback socket, so production URL construction is exercised
# rather than bypassed.
[dev-dependencies]
# Body types for the Service Usage stub's responses.
bytes = "1"
# Benchmark harness (see `benches/`). Chosen over criterion because its
# `AllocProfiler` counts allocations per benchmark out of the box, which is the
# instrument the optimization plan's zero-allocation search criterion is
# measured with; criterion would need dhat bolted on, and pulls in rayon,
# plotters and regex for statistics this micro-scale work does not need.
divan = "0.1.21"
http-body-util = "0.1"
# Serves the upstreams. `StreamableHttpService` is a plain `tower` service, so
# hyper alone is enough; no web framework is pulled in.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
# Ephemeral self-signed certs, generated in memory per run. Avoids committing a
# private key to the repository.
rcgen = "0.14"
# The in-process upstream is a real MCP server speaking the real protocol
# (plan section 4-P5), not a canned-response fake.
rmcp = { version = "3.1", features = [
    "server",
    "transport-streamable-http-server",
    # The live tier drives the real compiled binary over its real stdio
    # transport, rather than re-assembling the server in-process.
    "transport-child-process",
] }
rustls = "0.23"
# `test-util` supplies the paused clock the token-fetch timeout test runs on,
# so that test costs microseconds instead of the real 30s budget.
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "test-util"] }
tokio-rustls = "0.26"

# Stripping corrupts the Mach-O LINKEDIT segment of proc-macro dylibs on macOS,
# and dyld then refuses to load them ("mis-aligned LINKEDIT string pool"). The
# build fails claiming it cannot find `serde_derive`, `tokio_macros` and every
# other derive crate, which points nowhere near the real cause.
#
# The two settings below are the whole of P7's size win, measured one at a time
# against a 31,683,456-byte baseline (BASELINE.md section 12): together they
# remove 6,688,864 bytes, 21.1%. Both are deliberately here rather than in
# ambient `RUSTFLAGS`, so the shipped binary is decided by the repository and a
# benchmark can never inherit them by accident.
[profile.release]
strip = "none"
# -5,871,808 B on its own: the larger half of the win, and the only knob that
# moved `__LINKEDIT` (-2,588,672) as well as `__text` (-2,168,180).
codegen-units = 1
# A further -817,056 B on top of `codegen-units = 1`. "fat" specifically:
# "thin" was measured and is *worse than no LTO at all* here (+240,048 B
# against `codegen-units = 1` alone), trading 547 KB more `__text` for 262 KB
# less `__LINKEDIT`. Costs ~112 s to link instead of ~40 s, which is paid by
# whoever builds a release and by nobody else.
lto = "fat"

# Frozen deliberately at what `[profile.release]` used to be, and NOT to be
# "simplified" back into inheriting it.
#
# `[profile.bench]` inherits `[profile.release]` by default, so the settings
# above would otherwise reach every benchmark binary -- measured: `cargo bench
# --no-run` went from ~40 s to 110 s, and the divan numbers recorded in
# `BASELINE.md` sections 2a, 10 and 12 would have been taken under a profile
# that no longer exists.
#
# The two instruments have different jobs. The divan benches are the
# *differential* instrument: their value is comparing this crate's own code
# across phases, which requires the profile underneath them to hold still, and
# P5 has yet to be judged against them. The *decisive* instrument for a phase
# ruling is `scripts/bench-startup.sh` against the real release binary, which
# measures the shipped configuration by construction. So the shipped profile is
# free to diverge for size while the diagnostic one stays fixed; fidelity to
# the shipped link step is covered by the startup probe, not by these.
#
# (`[profile.test]` inherits dev, not release, so `nextest` pays none of this.)
[profile.bench]
codegen-units = 16
lto = false

# Micro-benchmarks over the committed 47-service / 548-tool snapshot. Each is a
# divan binary (`harness = false`), so `cargo bench` runs them one after
# another; they must never be run concurrently with each other or with
# `scripts/bench-startup.sh`, and never with `RUSTFLAGS` set, or the numbers
# are not comparable with `BASELINE.md`.
[[bench]]
name = "bench_search"
harness = false

[[bench]]
name = "bench_snapshot_load"
harness = false

[[bench]]
name = "bench_namespace_build"
harness = false

[[bench]]
name = "bench_classify_upstream"
harness = false
