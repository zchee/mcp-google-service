# cargo-deny policy: `cargo deny check` locally, and the `deny` job in CI.
#
# Licenses: the allow list is exactly the set the dependency graph carried
# when this file was written, so a dependency that changes its license (zstd
# went MIT -> BSD-3-Clause in 0.14) or pulls in a new one is a visible
# decision here rather than something `cargo update` does silently. Every
# entry is permissive and compatible with this crate's Apache-2.0. Copyleft
# alternatives that some crates list behind an OR (LGPL-2.1-or-later on
# r-efi, for example) are deliberately absent: cargo-deny satisfies an OR
# expression with any allowed member, so the permissive branch is what is
# taken.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[advisories]
# Unmaintained and yanked crates are reported, not tolerated: this binary
# holds Google credentials, so a dependency nobody patches is a finding.
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
